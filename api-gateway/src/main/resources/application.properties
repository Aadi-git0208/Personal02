spring.application.name=medicurex-api-gateway
server.port=8080

# Register this gateway with Eureka and resolve downstream services by name.
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Explicit routes. Paths are forwarded as-is (no prefix stripping).
# Authorization is not a hop-by-hop header, so JWT Bearer tokens are forwarded.
spring.cloud.gateway.server.webflux.default-filters[0]=PreserveHostHeader

spring.cloud.gateway.server.webflux.routes[0].id=identity-auth
spring.cloud.gateway.server.webflux.routes[0].uri=lb://medicurex-auth
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=profile
spring.cloud.gateway.server.webflux.routes[1].uri=lb://medicurex-profile-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/profiles/**

spring.cloud.gateway.server.webflux.routes[2].id=appointment
spring.cloud.gateway.server.webflux.routes[2].uri=lb://medicurex-appointment-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/appointments/**

spring.cloud.gateway.server.webflux.routes[3].id=chat
spring.cloud.gateway.server.webflux.routes[3].uri=lb://medicurex-chat-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/chat/**

spring.cloud.gateway.server.webflux.routes[4].id=prescription
spring.cloud.gateway.server.webflux.routes[4].uri=lb://medicurex-prescription-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/prescriptions/**

spring.cloud.gateway.server.webflux.routes[5].id=pharmacy
spring.cloud.gateway.server.webflux.routes[5].uri=lb://medicurex-pharmacy-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/medicines/**

spring.cloud.gateway.server.webflux.routes[6].id=order
spring.cloud.gateway.server.webflux.routes[6].uri=lb://medicurex-order-service
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/orders/**

# CORS for the React/Vite frontend. Preflight is handled here, not in downstream services.
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:5173,http://localhost:5174
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].exposed-headers=Authorization
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allow-credentials=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].max-age=3600

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=MediCurex API Gateway
