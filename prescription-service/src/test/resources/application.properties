spring.datasource.url=jdbc:h2:mem:medicurex_prescription;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.jwt.secret=TestOnlySecretKeyThatIsLongEnoughForHS256Algorithms!!
app.appointment-service.base-url=http://medicurex-appointment-service
app.pharmacy-service.base-url=http://medicurex-pharmacy-service

eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.cloud.discovery.enabled=false

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
