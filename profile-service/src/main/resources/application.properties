spring.application.name=medicurex-profile-service
server.port=8081

# MySQL — this service owns medicurex_profile only
spring.datasource.url=${PROFILE_DB_URL:jdbc:mysql://localhost:3306/medicurex_profile?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:3945}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# This service validates JWTs; it does not use an in-memory user store.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# Jackson
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT validation only — same secret as Identity/Auth. This service does not issue tokens.
app.jwt.secret=${JWT_SECRET:1e21b38316d34ecb0b1fd7d10d7b92478aaa5c2ca4c70f1dbeaef51b69967ffe}

# Eureka
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=true
info.app.name=${spring.application.name}
info.app.description=MediCurex Profile Service
