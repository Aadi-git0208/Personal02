spring.application.name=medicurex-auth
server.port=8080

# MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/apexcare?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:3945}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Jackson
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT
app.jwt.secret=${JWT_SECRET:1e21b38316d34ecb0b1fd7d10d7b92478aaa5c2ca4c70f1dbeaef51b69967ffe}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# Initial admin seed (no public admin registration)
app.admin.seed=${ADMIN_SEED:true}
app.admin.name=${ADMIN_NAME:MediCurex Admin}
app.admin.email=${ADMIN_EMAIL:admin@medicurex.local}
app.admin.password=${ADMIN_PASSWORD:ChangeMeAdmin123!}

# CORS — comma-separated frontend origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
