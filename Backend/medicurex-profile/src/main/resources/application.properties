spring.application.name=profile-service
server.port=8082
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# MySQL — dedicated schema, not the auth database
spring.datasource.url=${PROFILE_DB_URL:jdbc:mysql://localhost:3306/medicurex_profiles?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${PROFILE_DB_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${PROFILE_DB_PASSWORD:${DB_PASSWORD:3945}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# Must match Identity/Auth JWT_SECRET. Do not commit production secrets.
app.jwt.secret=${JWT_SECRET:78006c5fc58882433a8502a206a482dae10e842fd491f1b66b18cbe39b72be39}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
