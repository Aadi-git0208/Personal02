spring:
  application:
    name: medicurex-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          "[/**]":
            allowedOriginPatterns: "${CORS_ALLOWED_ORIGINS:http://localhost:5173}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - Authorization
              - Content-Type
              - Idempotency-Key
            exposedHeaders:
              - Authorization
            allowCredentials: true
      routes:
        # Existing Identity/Auth service. spring.application.name is medicurex-auth.
        # No StripPrefix: AuthController already serves /api/auth/**
        - id: identity-service
          uri: lb://medicurex-auth
          predicates:
            - Path=/api/auth/**
        # Future services — these IDs must match each service's spring.application.name.
        # Requests fail with 503 until the service registers with Eureka.
        - id: profile-service
          uri: lb://profile-service
          predicates:
            - Path=/api/profiles/**
        - id: appointment-service
          uri: lb://appointment-service
          predicates:
            - Path=/api/appointments/**
        - id: chat-service
          uri: lb://chat-service
          predicates:
            - Path=/api/chat/**
        - id: prescription-service
          uri: lb://prescription-service
          predicates:
            - Path=/api/prescriptions/**
        - id: pharmacy-service
          uri: lb://pharmacy-service
          predicates:
            - Path=/api/medicines/**
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: false
    hostname: localhost

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
